version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: tango-archive
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}64-bit
      {{- else if eq .Arch "386" }}32-bit
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}-{{ .Tag }}-checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - '^doc:'
      - '^test:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: roma-glushko
    name: tango
  prerelease: auto
  name_template: "{{.ProjectName}}-v{{.Version}}"
  disable: false

brews:
  - name: tango
    ids:
      - tango-archive
    repository:
      owner: roma-glushko
      name: homebrew-tango
    url_template: "https://github.com/roma-glushko/tango/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: tango-release-bot
      email: roman.glushko.m@gmail.com
    directory: Formula
    caveats: "Tango is on the scene! Type `tango --help` to get started"
    homepage: "https://github.com/roma-glushko/tango"
    description: "Tango is a command-line tool for dancing with access logs"
    install: bin.install "tango"
    test: system "#{bin}/tango --version"

scoops:
  - url_template: "https://github.com/roma-glushko/tango/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    repository:
      owner: roma-glushko
      name: scoop-tango
    commit_author:
      name: tango-release-bot
      email: roman.glushko.m@gmail.com
    homepage: "https://github.com/roma-glushko/tango"
    description: "Tango is a dependency-free command-line tool for analyzing server access logs"
    license: MIT
